<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ValueMap Prism Simulate — POC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#F1F4F5;--surface:#FFFFFF;--surface-2:#F6F8F9;--ink:#15222C;--ink-2:#34434F;--muted:#5E6C77;--line:#D9E0E4;--line-2:#E9EEF0;
--brand:#0E5A67;--brand-ink:#083A43;--brand-soft:#E3EFF1;--side:#0B3E47;--side-ink:#D5E6E9;--side-mute:#86A9AF;
--pos:#1B7A4B;--pos-soft:#E3F2EA;--neg:#B0392F;--neg-soft:#F8E6E4;--warn:#9A5F06;--warn-soft:#FBF0DC;--info:#35607F;--info-soft:#E6EEF5;
--base-c:#7A8792;--r-sm:4px;--r:6px;--r-lg:10px;--shadow:0 1px 2px rgba(10,40,50,.06),0 2px 8px rgba(10,40,50,.05);
--font:"Archivo",ui-sans-serif,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E151A;--surface:#152028;--surface-2:#1A2731;--ink:#E2EAEE;--ink-2:#C4D1D8;--muted:#8FA0AB;--line:#2A3944;--line-2:#22313B;
--brand:#4DB0BF;--brand-ink:#9ED6DF;--brand-soft:#16343A;--side:#0A1D22;--side-ink:#CFE2E6;--side-mute:#6F9197;--pos:#4FC08A;--pos-soft:#153326;--neg:#EF7E73;--neg-soft:#3A1D1A;--warn:#E3A948;--warn-soft:#352812;--info:#8DB8DA;--info-soft:#172A38;--base-c:#8C99A3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E151A;--surface:#152028;--surface-2:#1A2731;--ink:#E2EAEE;--ink-2:#C4D1D8;--muted:#8FA0AB;--line:#2A3944;--line-2:#22313B;--brand:#4DB0BF;--brand-ink:#9ED6DF;--brand-soft:#16343A;--side:#0A1D22;--side-ink:#CFE2E6;--side-mute:#6F9197;--pos:#4FC08A;--pos-soft:#153326;--neg:#EF7E73;--neg-soft:#3A1D1A;--warn:#E3A948;--warn-soft:#352812;--info:#8DB8DA;--info-soft:#172A38;--base-c:#8C99A3;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}.ico.sm{width:14px;height:14px}
.muted{color:var(--muted)}.sm{font-size:12px}small{font-size:12px}.pos-t{color:var(--pos)}.neg-t{color:var(--neg)}.nowrap{white-space:nowrap}
.row{display:flex;align-items:center;flex-wrap:wrap}.row.gap{gap:10px}.row.sb{justify-content:space-between;gap:8px}.r{text-align:right}

/* prism mark: a split beam — the product's single visual signature */
.prism-mark{width:26px;height:26px;flex:none;position:relative;background:conic-gradient(from 200deg at 30% 70%,#7A8792 0 60deg,#3F6FB5 60deg 110deg,#7A58B8 110deg 150deg,#C27A12 150deg 190deg,#1C8C8C 190deg 230deg,transparent 230deg);clip-path:polygon(0 100%,50% 0,100% 100%)}

/* layout */
#app{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:18px 18px 14px;color:inherit;text-decoration:none}.brand b{display:block;font-size:15px}.brand small{color:var(--side-mute);font-size:12px}
.side nav{padding:4px 10px;flex:1}.nav-sec{font-size:11.5px;color:var(--side-mute);padding:14px 10px 4px}
.nav-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r);color:var(--side-ink);text-decoration:none;font-size:13.5px}
.nav-i:hover{background:rgba(255,255,255,.06)}.nav-i.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 #C27A12}
.badge{margin-left:auto;background:#C27A12;color:#fff;font-size:11px;border-radius:9px;padding:0 6px;font-weight:600}
.side-foot{font-size:11.5px;color:var(--side-mute);padding:14px 18px;border-top:1px solid rgba(255,255,255,.08)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.crumbs{min-width:0}.crumbs a,.crumbs span{font-size:12.5px;color:var(--muted);text-decoration:none;margin-right:6px}.crumbs a:after,.crumbs span:after{content:"/";margin-left:6px;color:var(--line)}
.crumbs h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-r{display:flex;align-items:center;gap:12px;position:relative}
.demo-flag{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:3px 9px;border-radius:12px;white-space:nowrap}
.persona{display:flex;align-items:center;gap:9px;background:none;border:1px solid var(--line);border-radius:var(--r);padding:4px 10px 4px 5px;cursor:pointer;text-align:left}
.persona b{display:block;font-size:13px;line-height:1.2}.persona small{color:var(--muted);font-size:11.5px}
.av{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.persona-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 8px 30px rgba(0,0,0,.18);width:300px;padding:6px;z-index:50}
.persona-menu.open{display:block}.persona-menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:var(--r);cursor:pointer}
.persona-menu button:hover,.persona-menu button.on{background:var(--brand-soft)}.persona-menu b{display:block;font-size:13px}.persona-menu small{color:var(--muted)}.persona-menu .lo{border-top:1px solid var(--line);border-radius:0;margin-top:4px;color:var(--brand)}
.content{padding:22px 28px 60px;max-width:1500px;width:100%}

/* login */
#app.login-mode{display:block}.login{display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,1.05fr);min-height:100vh}
.login-l{background:var(--side);color:var(--side-ink);padding:56px 56px 40px;display:flex;flex-direction:column;gap:22px}
.brand.big{padding:0}.brand.big .prism-mark{width:40px;height:40px}.brand.big b{font-size:19px}
.login-h{font-size:clamp(28px,3.4vw,44px);line-height:1.08;color:#fff;max-width:14ch;font-weight:600;letter-spacing:-.02em;margin-top:28px}
.login-p{max-width:46ch;font-size:15.5px;line-height:1.55;color:var(--side-ink)}
.cycle{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:0}
.cycle li{padding:7px 14px 7px 12px;font-size:13px;color:#fff;border-bottom:3px solid var(--c);background:rgba(255,255,255,.04)}
.fine{font-size:12px;color:var(--side-mute);max-width:52ch;margin-top:auto}
.login-r{padding:56px 48px;display:flex;flex-direction:column;gap:16px;justify-content:center}.login-r h2{font-size:17px}.login-r .fine{color:var(--muted)}
.personas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pcard{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;cursor:pointer}
.pcard:hover{border-color:var(--brand);box-shadow:var(--shadow)}.pcard b{display:block}.pcard em{display:block;font-style:normal;color:var(--brand);font-size:12.5px}.pcard small{color:var(--muted)}

/* panels & grids */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:16px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.panel-h h2{font-size:15px;display:flex;align-items:center;gap:7px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid-2-1{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}.grid-1-2{display:grid;grid-template-columns:minmax(280px,1fr) minmax(0,2.2fr);gap:16px}
.grid-2>.panel,.grid-3>.panel,.grid-2-1>.panel,.grid-1-2>.panel{margin-bottom:0}.grid-2,.grid-3,.grid-2-1,.grid-1-2{margin-bottom:16px}
.stack-col{display:flex;flex-direction:column;gap:16px;min-width:0}.stack-col>.panel{margin-bottom:0}.stack-col .grid-2{margin-bottom:0}
.empty{color:var(--muted);padding:20px;text-align:center}.panel.empty{padding:36px}
.sub{font-size:13px;font-weight:600;margin:16px 0 8px;color:var(--ink-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 13px;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--brand)}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
:root[data-theme="dark"] .btn.primary,.btn.primary{color:#fff}@media (prefers-color-scheme:dark){.btn.primary{color:#062026}}
.btn.ghost{background:transparent}.btn.danger{background:var(--neg);border-color:var(--neg);color:#fff}.danger-t{color:var(--neg)}
.btn.sm{padding:4px 9px;font-size:12.5px}.btn.lg{padding:10px 18px;font-size:14.5px}.btn:disabled{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:0;color:var(--brand);cursor:pointer;font-size:13px;text-decoration:none;padding:0}.lnk:hover{text-decoration:underline}

/* home */
.hero-strip{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.hero-strip h2{font-size:22px}.hero-strip p{margin:4px 0 0;color:var(--muted)}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.kpi-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;min-width:0}.kpi span{color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi b{display:block;font-size:22px;font-weight:600;margin-top:4px;letter-spacing:-.01em}.kpi small{color:var(--muted)}
.pipe-r{display:grid;grid-template-columns:140px 1fr 28px;gap:10px;align-items:center;padding:4px 0}.pipe-r i{height:8px;background:var(--brand);border-radius:4px;opacity:.75;min-width:2px}.pipe-r b{text-align:right}
.attn{list-style:none;padding:0;margin:0}.attn li a{display:block;padding:9px 0;border-bottom:1px solid var(--line-2);text-decoration:none;color:var(--ink)}.attn li a:hover b{color:var(--brand)}.attn small{display:flex;gap:6px;align-items:center;color:var(--muted);margin-top:2px}

/* tables */
.tbl-wrap{overflow-x:auto;max-width:100%}.tbl-wrap.tall{max-height:420px;overflow-y:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
.tbl thead th{font-weight:600;color:var(--muted);font-size:12px;background:var(--surface-2);position:sticky;top:0;z-index:1;white-space:nowrap}
.tbl td small,.tbl th small{display:block;color:var(--muted)}.tbl .r{text-align:right}.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--brand-soft)}
.tbl tr.hl td:first-child{box-shadow:inset 3px 0 0 #C27A12}.code{font-size:11.5px;color:var(--muted)}
.tbl.mini td,.tbl.mini th{padding:5px 8px}.tbl input,.tbl select{width:100%;min-width:70px;padding:4px 6px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.tbl.cmp th:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:190px;font-weight:500}.tbl.cmp td{min-width:150px}.tbl.cmp thead th:first-child{background:var(--surface-2)}
.tbl .keyrow th,.tbl .keyrow td{background:var(--surface-2);font-weight:600}.tbl .sep th{background:var(--brand-soft);color:var(--brand-ink)}
.tbl.heat td{text-align:center;font-weight:600}.tbl.heat td small{display:block;font-weight:400}.h1{background:var(--neg-soft);color:var(--neg)}.h2{background:var(--warn-soft);color:var(--warn)}.h3{background:var(--info-soft);color:var(--info)}.h4{background:var(--pos-soft);color:var(--pos)}.na{color:var(--muted)}
.tbl.perm td:not(:first-child){text-align:center;color:var(--brand)}.tbl.trace-t tr.tot td{font-weight:600;border-top:1px solid var(--line)}

/* status & tags */
.status{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.st-Draft{color:var(--muted)}.st-Simulated{background:var(--info-soft);color:var(--info);border-color:transparent}.st-UnderReview,.st-AwaitingApproval,.st-Awaiting{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.st-Approved,.st-Reviewed{background:var(--pos-soft);color:var(--pos);border-color:transparent}.st-Rejected{background:var(--neg-soft);color:var(--neg);border-color:transparent}.st-Executed{background:var(--brand-soft);color:var(--brand-ink);border-color:transparent}.st-Monitoring{background:var(--brand);color:#fff;border-color:transparent}
.cls{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:3px;white-space:nowrap;vertical-align:1px;border:1px solid}
.cls-OBS{color:#35607F;border-color:#9DBAD0}.cls-CALC{color:#5E6C77;border-color:#B7C1C8}.cls-MODEL{color:#7A58B8;border-color:#C3B1E2}.cls-USER{color:#9A5F06;border-color:#E3C28C;background:var(--warn-soft)}.cls-AI{color:#fff;background:#1C8C8C;border-color:#1C8C8C}
.dq{font-size:10.5px;padding:1px 6px;border-radius:3px;font-weight:600;white-space:nowrap}.dq-Validated{color:var(--pos);background:var(--pos-soft)}.dq-Stale{color:var(--warn);background:var(--warn-soft)}.dq-Estimated{color:var(--info);background:var(--info-soft)}.dq-Missing{color:var(--neg);background:var(--neg-soft)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--brand);color:#fff;font-weight:600}.chip.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line);font-weight:500}.chip.best{background:#C27A12;font-size:11px}.chip.pref{background:var(--pos);font-size:11px}
.delta{display:inline-block;font-size:12px;font-weight:600;white-space:nowrap}.delta em{font-style:normal;font-weight:500;opacity:.85}.delta.pos{color:var(--pos)}.delta.neg{color:var(--neg)}.delta.flat{color:var(--muted);font-weight:500}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.flag{font-size:10.5px;color:var(--neg);border:1px solid var(--neg);border-radius:3px;padding:0 4px}.wcount{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--neg-soft);color:var(--neg);font-size:11px;font-weight:700}

/* forms */
label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input:not([type=range]):not([type=checkbox]):not([type=radio]),select,textarea{border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;background:var(--surface);color:var(--ink);font-size:13.5px;width:100%}
textarea{resize:vertical}.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}.filters label{min-width:130px}.filters .grow{flex:1;min-width:220px}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:13px;margin:8px 0}label.radio{flex-direction:row;align-items:flex-start;gap:8px;color:var(--ink);font-size:13px;margin:6px 0}
.btn-l{min-width:0!important}.blk{margin-bottom:12px}fieldset.blk{border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}legend{font-size:12.5px;color:var(--muted);padding:0 4px}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}.form-grid .span2{grid-column:span 2}.form-grid.one{grid-template-columns:1fr}
label.inline{flex-direction:row;align-items:center;gap:8px}label.inline input{width:90px}
input[type=range]{accent-color:var(--brand);width:100%}

/* customer 360 */
.c360-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.cname{font-size:21px}
.facts{display:grid;grid-template-columns:repeat(6,minmax(0,auto));gap:6px 26px;margin:12px 0 0}.facts dt{font-size:11.5px;color:var(--muted)}.facts dd{margin:0;font-weight:500}
.c360-cta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;justify-content:center}
.warn-bar{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}.warn-bar span{padding:8px 12px;border-radius:var(--r);font-size:13px}
.w-high{background:var(--neg-soft);color:var(--neg)}.w-med{background:var(--warn-soft);color:var(--warn)}.w-info{background:var(--info-soft);color:var(--info)}
.commit{margin-bottom:12px}.prog{height:7px;background:var(--line-2);border-radius:4px;overflow:hidden;margin:5px 0 3px}.prog i{display:block;height:100%;background:var(--pos)}.prog i.mid{background:#C27A12}.prog i.lo{background:var(--neg)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0}.kv dt{font-size:12px;color:var(--muted)}.kv dd{margin:2px 0 0;font-weight:500;display:flex;gap:6px;align-items:center}
.stackbar{display:flex;height:12px;border-radius:3px;overflow:hidden;margin-top:12px}.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:6px}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}

/* workspace */
.ribbon{list-style:none;display:flex;margin:0 0 14px;padding:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.ribbon li{flex:1;text-align:center;font-size:12.5px;padding:7px 4px;color:var(--muted);border-bottom:3px solid transparent;position:relative}
.ribbon li.done{color:var(--ink-2);border-bottom-color:var(--c);opacity:.8}.ribbon li.now{color:var(--ink);font-weight:600;border-bottom-color:var(--c);background:var(--surface-2)}
.ws-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:10px}.ws-head h2{font-size:18px}.ws-head .q{margin:6px 0 4px;color:var(--ink-2);max-width:90ch;font-size:13.5px}.ws-head-r{display:flex;gap:8px;align-items:flex-start}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}.tabs a{padding:9px 14px;color:var(--muted);text-decoration:none;font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--ink);border-bottom-color:var(--brand);font-weight:600}.tabs a:hover{color:var(--ink)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#C27A12;vertical-align:1px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.schips{display:flex;gap:6px;flex-wrap:wrap}.sacts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.schip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 11px;cursor:pointer;font-size:13px}
.schip i{width:10px;height:10px;border-radius:2px;background:var(--c)}.schip small{color:var(--muted)}.schip.on{border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c);font-weight:600}.schip em.pref{font-style:normal;font-size:10.5px;background:var(--pos);color:#fff;border-radius:3px;padding:0 5px}
.ws-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,1fr);gap:16px;align-items:start}.impact{position:sticky;top:76px}.impact .panel{margin-bottom:0}
.nl{background:var(--brand-soft);border-radius:var(--r);padding:10px 12px;margin-bottom:12px}.nl label{color:var(--brand-ink);font-weight:500;margin-bottom:6px}.nl .row{gap:8px;flex-wrap:nowrap}

<body><div id="app"></div><div id="modal"></div><div id="toasts" aria-live="polite"></div>
<script>/* =====================================================================
   PRISM SIMULATE — CALCULATION ENGINE (pure, deterministic, no DOM)
   Layers: PricingEngine · ProfitabilityEngine · RiskService ·
           SensitivityService · DriverService · StressService ·
           PortfolioEngine · CampaignEngine · ProductEngine
   All money in INR Crore (Cr) unless stated. 1 Cr = 1e7 INR.
   NOTE: simplified management-accounting formulas for demonstration.
         Not regulatory capital, IFRS 9 or Basel calculations.
   ===================================================================== */
const Engine = (() => {
  const CR = 1e7;
  const round = (x, d = 6) => Math.round(x * 10 ** d) / 10 ** d;

  /* ---------------- PRICING ENGINE ---------------- */
  const METRIC_LABEL = { volume: 'Monthly transaction volume', value: 'Monthly transaction value (Cr)', deposit: 'Deposit balance (Cr)' };
  function metricValue(ctx, m) {
    if (m === 'volume') return ctx.volume;
    if (m === 'value') return ctx.value / CR;
    if (m === 'deposit') return ctx.deposit;
    return 0;
  }
  function compare(v, op, t) {
    switch (op) { case '>=': return v >= t; case '>': return v > t; case '<=': return v <= t; case '<': return v < t; case '=': return v === t; default: return false; }
  }
  function checkConditions(cond, ctx) {
    if (!cond || !cond.items || !cond.items.length) return { ok: true, trace: [] };
    const res = cond.items.map(c => {
      const v = metricValue(ctx, c.metric); const ok = compare(v, c.cmp, Number(c.value));
      return { ok, text: `${METRIC_LABEL[c.metric]} = ${fmtN(v)} ${c.cmp} ${fmtN(c.value)} → ${ok ? 'met' : 'not met'}` };
    });
    const ok = cond.op === 'OR' ? res.some(r => r.ok) : res.every(r => r.ok);
    return { ok, trace: [...res.map(r => r.text), `${cond.op} combination → ${ok ? 'rule applies' : 'rule does not apply'}`] };
  }
  const fmtN = v => (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString('en-IN') : round(v, 2).toString());
  // rate: INR per transaction when appliedTo = volume; % of value when appliedTo = value
  function applyRate(rate, appliedTo, ctx) { return appliedTo === 'value' ? ctx.value * rate / 100 : rate * ctx.volume; }
  function rateText(rate, appliedTo) { return appliedTo === 'value' ? `${rate}% of value` : `₹${rate} per transaction`; }

  /** Evaluate a pricing rule for one month. Returns monthly fee in INR and a readable trace. */
  function evaluatePricing(rule, ctx) {
    const trace = [];
    const cond = checkConditions(rule.conditions, ctx);
    trace.push(...cond.trace);
    if (!cond.ok) {
      const fee = applyRate(Number(rule.elseRate || 0), 'volume', ctx);
      trace.push(`Fallback: ₹${rule.elseRate} × ${fmtN(ctx.volume)} txns = ₹${fmtN(fee)}`);
      return { fee, perTxn: ctx.volume ? fee / ctx.volume : 0, trace, applied: false };
    }
    let fee = 0; let tierIdx = -1;
    const appliedTo = rule.appliedTo || 'volume';
    switch (rule.type) {
      case 'fixed':
        fee = applyRate(Number(rule.rate), appliedTo, ctx);
        trace.push(`Fixed: ${rateText(rule.rate, appliedTo)} applied to ${appliedTo} = ₹${fmtN(fee)}`);
        break;
      case 'percent': {
        const pct = Number(rule.pct);
        const hasBounds = rule.min != null && rule.min !== '' || rule.max != null && rule.max !== '';
        if (hasBounds) {
          let per = ctx.avgValue * pct / 100; const raw = per;
          if (rule.min !== '' && rule.min != null) per = Math.max(per, Number(rule.min));
          if (rule.max !== '' && rule.max != null) per = Math.min(per, Number(rule.max));
          fee = per * ctx.volume;
          trace.push(`${pct}% × avg value ₹${fmtN(ctx.avgValue)} = ₹${fmtN(raw)} per txn; bounded [${rule.min ?? '–'}, ${rule.max ?? '–'}] → ₹${fmtN(per)}`);
          trace.push(`₹${fmtN(per)} × ${fmtN(ctx.volume)} txns = ₹${fmtN(fee)}`);
        } else {
          fee = ctx.value * pct / 100;
          trace.push(`${pct}% × monthly value ₹${fmtN(ctx.value)} = ₹${fmtN(fee)}`);
        }
        break;
      }
      case 'slab': {
        const basis = metricValue(ctx, rule.basedOn || 'volume');
        tierIdx = rule.tiers.findIndex(t => t.to == null || t.to === '' || basis <= Number(t.to));
        if (tierIdx < 0) tierIdx = rule.tiers.length - 1;
        const t = rule.tiers[tierIdx];
        fee = applyRate(Number(t.rate), appliedTo, ctx);
        trace.push(`Based on ${METRIC_LABEL[rule.basedOn || 'volume']} = ${fmtN(basis)} → tier ${tierIdx + 1} (${t.from}–${t.to ?? '∞'})`);
        trace.push(`Applied to ${appliedTo}: ${rateText(t.rate, appliedTo)} on the whole ${appliedTo} = ₹${fmtN(fee)}`);
        break;
      }
      case 'progressive': {
        // Each band of the applied-to quantity is charged at its own rate
        const q = appliedTo === 'value' ? ctx.value / CR : ctx.volume;
        rule.tiers.forEach((t, i) => {
          const from = Number(t.from); const to = t.to == null || t.to === '' ? Infinity : Number(t.to);
          const portion = Math.max(0, Math.min(q, to) - from);
          if (portion <= 0) return;
          const part = appliedTo === 'value' ? portion * CR * Number(t.rate) / 100 : portion * Number(t.rate);
          fee += part;
          trace.push(`Band ${i + 1} (${from}–${to === Infinity ? '∞' : to}): ${fmtN(portion)} × ${rateText(t.rate, appliedTo)} = ₹${fmtN(part)}`);
        });
        trace.push(`Progressive total = ₹${fmtN(fee)}`);
        break;
      }
      default: trace.push('Unknown rule type');
    }
    return { fee, perTxn: ctx.volume ? fee / ctx.volume : 0, trace, applied: true, tierIdx };
  }

  /* ---------------- PROFITABILITY ENGINE (relationship) ---------------- */
  function effective(a, base, k, f) { return base && a[k] > base[k] ? base[k] + (a[k] - base[k]) * f : a[k]; }

  /**
   * SimulationRequest: assumptions a, baseline b, config cfg
   * SimulationResult: kpi, lines, trace (per KPI), drivers-ready
   */
  function simulate(a, b, cfg) {
    const f = (a.fulfilPct ?? 100) / 100; // commitment fulfilment probability applied to uplifts only
    const cof = (a.cofBps || 0) / 100;     // parallel funding shift in % points
    const depBal = effective(a, b, 'depBal', f);
    const txnVol = effective(a, b, 'txnVol', f);
    const tfVol = effective(a, b, 'tfVol', f);
    const attr = 1 - (a.attritionPct || 0) / 100;

    // Lending
    const wcII = a.wcBal * a.wcRate / 100, wcFund = a.wcBal * (a.wcFtp + cof) / 100;
    const tlII = a.tlBal * a.tlRate / 100, tlFund = a.tlBal * (a.tlFtp + cof) / 100;
    const invII = a.invBal * a.invYield / 100, invFund = a.invBal * (a.wcFtp + cof) / 100;
    const interestIncome = wcII + tlII + invII;
    const fundingCost = wcFund + tlFund + invFund;
    const lendingNII = interestIncome - fundingCost;
    // Deposits: funding value = balance × (FTP credit − customer rate)
    const depValue = depBal * attr * (a.depFtp + cof * 0.5 - a.depRate) / 100;
    const nii = lendingNII + depValue;

    // Transaction banking via pricing engine
    const monthlyValue = txnVol * a.txnVal;
    const disc = 1 - (a.feeDiscPct || 0) / 100;
    const rule = a.condFeeOn
      ? { type: 'fixed', rate: a.condFee * disc, appliedTo: 'volume', elseRate: a.txnFee * disc, conditions: { op: 'AND', items: [{ metric: 'deposit', cmp: '>=', value: a.condDep }, { metric: 'volume', cmp: '>=', value: a.condVol }] } }
      : { type: 'fixed', rate: a.txnFee * disc, appliedTo: 'volume' };
    const pr = evaluatePricing(rule, { volume: txnVol, value: monthlyValue, avgValue: a.txnVal, deposit: depBal });
    const txnFeeRev = pr.fee * 12 / CR * attr;
    const tfFee = tfVol * a.tfComm / 100 * attr;
    const otherInc = a.otherInc;
    const feeIncome = txnFeeRev + tfFee + otherInc;
    const revenue = nii + feeIncome;

    // Costs
    const txnCost = txnVol * 12 * a.txnCostPer / CR;
    const directCost = a.directCost + a.servicingCost + txnCost;
    const indirectCost = a.indirectCost;
    const totalCost = directCost + indirectCost;

    // Risk & capital (simplified)
    const undrawn = Math.max(0, a.wcLimit - a.wcBal);
    const tfOut = tfVol * 0.25; // ~90-day average tenor
    const ead = a.wcBal + a.tlBal + a.invBal + undrawn * a.ccf / 100 + tfOut * 0.2;
    const el = ead * a.pd / 100 * a.lgd / 100 * (a.riskMult / 100);
    const rwa = ead * a.riskWeight / 100;
    const capital = rwa * cfg.capitalRatio / 100;
    const pbt = revenue - totalCost - el;
    const pat = pbt * (1 - cfg.taxRate / 100);
    const raroc = capital > 0 ? pat / capital * 100 : 0;
    const eva = pat - capital * cfg.hurdleRate / 100;

    // Commitment coverage today (baseline actual vs commitment asked)
    const ref = b || a;
    const cov = [ref.depBal / a.depCommit, ref.txnVol / a.txnCommit, ref.tfVol / a.tfCommit].map(x => Math.min(1, x || 0));
    const commitCoverage = cov.reduce((s, x) => s + x, 0) / cov.length * 100;

const pct = (v, d = 1) => (v == null || isNaN(v) || !isFinite(v)) ? '–' : `${fmt(v, d)}%`;

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const nowStamp = () => { const d = new Date(); return d.toISOString(); };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtDate = iso => { if (!iso) return '–'; const d = new Date(iso); return `${String(d.getDate()).padStart(2, '0')}-${MON[d.getMonth()]}-${d.getFullYear()}`; };
const fmtDT = iso => { if (!iso) return '–'; const d = new Date(iso); return `${fmtDate(iso)} ${d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`; };
function fieldFmt(f, v) {
  if (f.unit === 'bool') return v ? 'On' : 'Off';
  if (f.unit === '%') return pct(v, f.step < 0.1 ? 2 : 1);
  if (f.unit === 'Cr') return cr(v, v >= 100 ? 1 : 2);
  if (f.unit === 'txns') return int(v);
  if (f.unit === 'bps') return `${v > 0 ? '+' : ''}${int(v)} bps`;
  if (f.unit === '₹') return `₹${fmt(v, v >= 1000 ? 0 : 2)}`;
  return fmt(v);
}
/** Delta pill. inverse=true when a decrease is good (costs, RWA). */
function dlt(v, base, o = {}) {
  const d = v - base; if (!isFinite(d)) return '';
  const p = base ? d / Math.abs(base) * 100 : 0;
  const good = o.inverse ? d < 0 : d > 0; const flat = Math.abs(d) < (o.eps ?? 1e-4);
  const cls = flat || o.neutral ? 'flat' : good ? 'pos' : 'neg';
  const abs = o.bps ? `${d > 0 ? '+' : '−'}${fmt(Math.abs(d) * 100, 0)} bps` : o.pp ? `${d > 0 ? '+' : ''}${fmt(d, 1)} pp` : o.unit === 'Cr' ? `${d > 0 ? '+' : '−'}₹${fmt(Math.abs(d), 2)} Cr` : o.unit === 'txns' ? `${d > 0 ? '+' : '−'}${int(Math.abs(d))}` : `${d > 0 ? '+' : ''}${fmt(d, 2)}`;
  return `<span class="delta ${cls}">${flat ? 'no change' : abs}${!flat && !o.pp && !o.bps && o.showPct !== false ? ` <em>${p > 0 ? '+' : ''}${fmt(p, 1)}%</em>` : ''}</span>`;
}
const tag = c => `<span class="cls cls-${c}" title="${esc(CLS[c])}">${esc(CLS[c])}</span>`;
const statusPill = s => `<span class="status st-${s.replace(/\s/g, '')}">${esc(s)}</span>`;

/* ---------------- state & repository ---------------- */
let S = null;
const CUSTOMERS = Seed.buildCustomers();
const custById = id => CUSTOMERS.find(c => c.id === id);
const userById = id => Seed.USERS.find(u => u.id === id);
const byRole = r => Seed.USERS.find(u => u.role === r);

function freshState() {
  const st = { userId: null, cfg: { ...Seed.CONFIG }, sims: [], audit: [], outcomes: [], rules: JSON.parse(JSON.stringify(Seed.RULES)), stressRuns: [], seq: 1026, notices: [],
    product: null, campaign: null, portfolioLevers: null };
  S = st; seedSimulations(); return st;
}
function save() { try { const { ...copy } = S; localStorage.setItem(STORE_KEY, JSON.stringify(copy)); } catch (e) { /* storage unavailable: session-only */ } }
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) { S = JSON.parse(raw); if (S && S.sims) return; } } catch (e) { /* ignore */ }
  freshState(); save();
}
const me = () => userById(S.userId);
const simById = id => S.sims.find(s => s.id === id);
const nextCode = () => `SIM-${++S.seq}`;
const uid = p => `${p}-${Math.random().toString(36).slice(2, 8)}`;

/* ---------------- authorization (single place) ---------------- */
const Auth = {
  can(action, ctx = {}) {
    const u = me(); if (!u) return false; const r = u.role; const sim = ctx.sim;
    switch (action) {
      case 'relationship.create': return ['RM', 'RH'].includes(r);
      case 'scenario.edit': return !!sim && sim.owner === u.id && ['Draft', 'Simulated', 'Rejected'].includes(sim.status);
      case 'sim.submit': return !!sim && sim.owner === u.id && ['Draft', 'Simulated', 'Rejected'].includes(sim.status) && !!sim.selectedId;
      case 'approval.act': {
        const step = ctx.step; if (!sim || !step || step.status !== 'Pending') return false;
        if (step.role !== r) return false;
        if (S.cfg.makerChecker && sim.owner === u.id) return false;
        const order = sim.approvals.findIndex(x => x.status === 'Pending'); return sim.approvals[order] === step;
      }
      case 'sim.execute': return !!sim && sim.status === 'Approved' && (sim.owner === u.id || r === 'BH');
      case 'sim.monitor': return !!sim && sim.status === 'Executed' && (sim.owner === u.id || r === 'BH');
      case 'product.edit': return ['PROD', 'PM'].includes(r);
      case 'rules.edit': return ['PROD', 'PM'].includes(r);
      case 'portfolio.edit': return ['PORT', 'CFO', 'BH'].includes(r);
      case 'campaign.edit': return ['PROD', 'PORT', 'RM'].includes(r);
      case 'stress.save': return ['CFO', 'RISK', 'BH', 'PORT'].includes(r);
      case 'admin.edit': return ['CFO', 'BH'].includes(r);
      default: return false;
    }
  },
  why(action, ctx = {}) {
    const u = me(); const sim = ctx.sim;
    if (action === 'approval.act' && sim && S.cfg.makerChecker && sim.owner === u.id) return 'Maker-checker: you created this simulation, so you cannot approve it.';
    if (action === 'approval.act' && ctx.step && ctx.step.role !== u.role) return `Waiting for ${Seed.ROLES[ctx.step.role]}.`;
    if (action === 'scenario.edit' && sim && sim.owner !== u.id) return `Read-only: owned by ${userById(sim.owner)?.name}.`;
    if (action === 'scenario.edit' && sim) return `Read-only while ${sim.status.toLowerCase()}.`;
    return `Not available to ${Seed.ROLES[u.role]}.`;
  },
};

/* ---------------- audit ---------------- */
function audit(action, o = {}) {
  S.audit.unshift({ id: uid('AU'), ts: o.ts || nowStamp(), user: o.user || me()?.name || 'System', role: o.role || (me() ? Seed.ROLES[me().role] : ''), action, simId: o.simId || null, scenario: o.scenario || '', oldV: o.oldV ?? '', newV: o.newV ?? '', rationale: o.rationale || '', status: o.status || '' });
  if (S.audit.length > 800) S.audit.length = 800;
}

/* ---------------- scenario service ---------------- */
const Scen = {
  make(name, a, cls = {}, note = '') { return { id: uid('SC'), name, a: { ...a }, cls: { ...cls }, note, version: 1, versions: [{ v: 1, at: nowStamp(), by: me()?.name || 'System', note: 'Created', a: { ...a } }] }; },
  results(sim) {
    const b = sim.baseline; const base = E.simulate(b, b, S.cfg);
    return { base, list: sim.scenarios.map(s => ({ s, r: E.simulate(s.a, b, S.cfg) })) };
  },
  color(sim, sc) { const i = sim.scenarios.indexOf(sc); return SCEN_COLORS[(i < 0 ? 0 : i) % SCEN_COLORS.length]; },
  meta(sim) { const c = custById(sim.customerId); const stale = Seed.SOURCES.filter(s => s.ageDays > S.cfg.staleDays && ['TFP'].includes(s.id)); return { peakDep: c?.peakDep, peakTxn: c?.peakTxn, staleSources: sim.type === 'relationship' ? stale : [] }; },
  impact(sim) {
    if (!sim.scenarios?.length || !sim.baseline) return sim.impact ?? 0;
    const { base, list } = Scen.results(sim); const sel = list.find(x => x.s.id === sim.selectedId) || list.slice().sort((p, q) => q.r.kpi.pbt - p.r.kpi.pbt)[0];
    return sel ? sel.r.kpi.pbt - base.kpi.pbt : 0;
  },
  revImpact(sim) {
    if (!sim.scenarios?.length || !sim.baseline) return sim.revImpact ?? 0;
    const { base, list } = Scen.results(sim); const sel = list.find(x => x.s.id === sim.selectedId) || list.slice().sort((p, q) => q.r.kpi.pbt - p.r.kpi.pbt)[0];
    return sel ? sel.r.kpi.revenue - base.kpi.revenue : 0;
  },
};

function newRelationshipSim(c, opts = {}) {
  const b = { ...c.a };
  const sim = { id: uid('S'), code: opts.code || nextCode(), type: opts.type || 'relationship', name: opts.name || `${c.name.replace(/ (Ltd\.|Co\.)$/, '')} — relationship renewal`, customerId: c.id,
    owner: opts.owner || S.userId, status: 'Draft', createdAt: opts.createdAt || nowStamp(), updatedAt: opts.createdAt || nowStamp(), question: opts.question || 'The customer is asking for improved pricing. What can the bank offer while maintaining acceptable total relationship economics?',
    baseline: b, baselineMeta: { id: `BL-${c.id}-2608`, asOf: Seed.AS_OF, snapshot: `SNAP-${c.id.slice(-4)}-0831`, model: 'Risk Engine v3.2 · FTP curve Aug-26 · Pricing engine 1.4' },
    scenarios: [], selectedId: null, rationale: '', approvals: [], aiLog: [], stressSaved: [] };
  if (opts.template === 'renewal') {
    Seed.renewalScenarios(b).forEach(t => { const cls = {}; t.changed.forEach(k => cls[k] = 'USER'); sim.scenarios.push(Scen.make(t.name, t.a, cls, t.note)); });
    sim.status = 'Simulated';
  } else if (opts.template !== 'none') {
    sim.scenarios.push(Scen.make('Scenario A', b, {}, 'Copy of baseline — edit assumptions to model an alternative.'));
    sim.status = 'Simulated';
  }
  return sim;
}

/* ---------------- workflow service ---------------- */
const Workflow = {
  STATUSES: ['Draft', 'Simulated', 'Under Review', 'Awaiting Approval', 'Approved', 'Rejected', 'Executed', 'Monitoring'],
  submit(sim, rationale) {
    const sel = sim.scenarios.find(s => s.id === sim.selectedId); const b = sim.baseline;
    const base = E.simulate(b, b, S.cfg), res = E.simulate(sel.a, b, S.cfg);
    sim.approvals = E.requiredApprovals(sel.a, b, res, base, S.cfg).map(x => ({ ...x, status: 'Pending', by: null, at: null, comment: '' }));
    sim.rationale = rationale; sim.submittedAt = nowStamp();
    sel.versions.push({ v: ++sel.version, at: nowStamp(), by: me().name, note: 'Frozen on submission', a: { ...sel.a } });
    sim.warningsAtSubmit = E.warnings(res, base, sel.a, b, S.cfg, Scen.meta(sim)).map(w => w.text);
    Workflow.refresh(sim);
    audit('Submitted for approval', { simId: sim.id, scenario: sel.name, oldV: 'Simulated', newV: sim.status, rationale, status: sim.status });
    notify(`Submitted ${sim.code}. Routed to ${sim.approvals.map(a => Seed.ROLES[a.role]).join(', ')}.`);
  },
  refresh(sim) {
    const pending = sim.approvals.filter(a => a.status === 'Pending');
    if (sim.approvals.some(a => a.status === 'Rejected')) sim.status = 'Rejected';
    else if (!pending.length) { sim.status = 'Approved'; sim.approvedAt = nowStamp(); }
    else sim.status = pending[0].stage === 'review' ? 'Under Review' : 'Awaiting Approval';
    sim.updatedAt = nowStamp();
  },
  act(sim, step, decision, comment) {
    const old = sim.status;
    step.status = decision === 'approve' ? (step.stage === 'review' ? 'Reviewed' : 'Approved') : 'Rejected';
    step.by = me().name; step.at = nowStamp(); step.comment = comment;
    Workflow.refresh(sim);
    const sel = sim.scenarios.find(s => s.id === sim.selectedId);
    audit(`${Seed.ROLES[me().role]} ${step.status.toLowerCase()} ${sel?.name || ''}`.trim(), { simId: sim.id, scenario: sel?.name, oldV: old, newV: sim.status, rationale: comment, status: sim.status });
    if (sim.status === 'Approved') { sim.packageId = `DP-${sim.code.slice(4)}`; audit('Decision package generated', { simId: sim.id, scenario: sel?.name, newV: sim.packageId, status: 'Approved', user: 'Prism Workflow' }); }
  },
  execute(sim) { const o = sim.status; sim.status = 'Executed'; sim.executedAt = nowStamp(); audit('Marked as executed in source systems (mock)', { simId: sim.id, oldV: o, newV: 'Executed', status: 'Executed' }); },
  monitor(sim) { const o = sim.status; sim.status = 'Monitoring'; Outcomes.create(sim); audit('Outcome monitoring started', { simId: sim.id, oldV: o, newV: 'Monitoring', status: 'Monitoring' }); },
};

/* ---------------- outcome / learning loop ---------------- */
const Outcomes = {
  create(sim, forced) {
    const sel = sim.scenarios.find(s => s.id === sim.selectedId); if (!sel) return;
    const r = E.prng(sim.code.split('').reduce((h, ch) => h * 31 + ch.charCodeAt(0), 7));
    const f = forced || { depBal: 0.88 + r() * 0.1, txnVol: 0.93 + r() * 0.1, tfVol: 0.95 + r() * 0.2 };
    const act = { ...sel.a, depBal: sel.a.depBal * (f.depBal ?? 1), txnVol: Math.round(sel.a.txnVol * (f.txnVol ?? 1)), tfVol: sel.a.tfVol * (f.tfVol ?? 1) };
    if (forced?.abs) Object.assign(act, forced.abs);
    S.outcomes.unshift({ id: uid('OC'), simId: sim.id, months: forced?.months ?? 1, expectedA: { ...sel.a }, actualA: act, asOf: forced?.asOf || Seed.AS_OF });
  },
  view(o) {
    const sim = simById(o.simId); const b = sim.baseline;
    const exp = E.simulate(o.expectedA, b, S.cfg).kpi, act = E.simulate(o.actualA, b, S.cfg).kpi, base = E.simulate(b, b, S.cfg).kpi;
    const rows = [
      { k: 'Deposits', e: o.expectedA.depBal, a: o.actualA.depBal, f: v => cr(v, 1) },
      { k: 'Transactions / month', e: o.expectedA.txnVol, a: o.actualA.txnVol, f: int },
      { k: 'Trade finance / year', e: o.expectedA.tfVol, a: o.actualA.tfVol, f: v => cr(v, 1) },
      { k: 'Revenue', e: exp.revenue, a: act.revenue, f: v => cr(v) },
      { k: 'Profit before tax', e: exp.pbt, a: act.pbt, f: v => cr(v) },
      { k: 'RAROC', e: exp.raroc, a: act.raroc, f: v => pct(v), pp: true },
    ].map(x => ({ ...x, v: x.pp ? x.a - x.e : (x.a - x.e) / Math.abs(x.e) * 100 }));
    const pv = (act.pbt - exp.pbt) / Math.abs(exp.pbt) * 100;
    const status = pv >= 2 ? 'Above expectation' : pv >= -5 ? 'On track' : 'Below expectation';
    // Deterministic explanation built from the variances
    const parts = []; const dep = rows[0], txn = rows[1], tf = rows[2];
    const shortfalls = [dep, txn, tf].filter(x => x.v < -2).map(x => `${x.k.toLowerCase()} (${fmt(x.v, 1)}%)`);
    const beats = [dep, txn, tf].filter(x => x.v > 2).map(x => `${x.k.toLowerCase()} (+${fmt(x.v, 1)}%)`);
    parts.push(act.pbt >= base.pbt ? `Relationship profit of ${cr(act.pbt)} remains above the pre-decision baseline of ${cr(base.pbt)}` : `Relationship profit of ${cr(act.pbt)} has fallen below the pre-decision baseline of ${cr(base.pbt)}`);
    if (shortfalls.length) parts.push(`despite lower-than-expected ${shortfalls.join(' and ')}`);
    if (beats.length) parts.push(`because ${beats.join(' and ')} exceeded plan`);
    let text = parts.join(' ') + '.';
    if (dep.v < -5) text += ` Deposit delivery is the main gap; consider a commitment review with the customer before the next pricing reset.`;
    text += ` Learning signal: the fulfilment model assumed 100% delivery; observed delivery suggests ${fmt(clamp(70 + (dep.v + txn.v) * 1.5 + 25, 50, 100), 0)}% for similar ${custById(sim.customerId)?.segment || ''} renewals.`;
    return { rows, status, text, exp, act, base, sim };
  },
};

/* ---------------- AI service (deterministic, grounded in engine results) ---------------- */
const AI = {
  mode: 'Prism rules engine · no LLM connected',
  generate(sim, target = 16) {
    const b = sim.baseline; const base = E.simulate(b, b, S.cfg).kpi; const c = custById(sim.customerId);
    const plans = [
      { bps: 25, txn: 0.10, tf: 0, name: 'AI · Price-led' },
      { bps: 35, txn: 0.15, tf: 0.10, name: 'AI · Balanced' },
      { bps: 40, txn: 0.25, tf: 0.20, name: 'AI · Relationship-led' },
    ];
    return plans.map(p => {
      let found = null;
      for (let dep = Math.round(b.depBal); dep <= b.depBal + 60; dep += 1) {
        const a = { ...b, wcRate: +(b.wcRate - p.bps / 100).toFixed(2), depBal: dep, depCommit: Math.max(b.depCommit, dep), txnVol: Math.round(b.txnVol * (1 + p.txn) / 100) * 100, tfVol: +(b.tfVol * (1 + p.tf)).toFixed(1) };
        a.txnCommit = Math.max(b.txnCommit, a.txnVol); a.tfCommit = Math.max(b.tfCommit, a.tfVol);
        const k = E.simulate(a, b, S.cfg).kpi;
        if (k.raroc >= target && k.revenue > base.revenue) { found = { a, k }; break; }
      }
      if (!found) return { ...p, feasible: false, reason: `No deposit level up to +₹60 Cr keeps RAROC ≥ ${target}% with a ${p.bps} bps concession.` };
      const changed = ['wcRate', 'depBal', 'depCommit', 'txnVol', 'txnCommit', 'tfVol', 'tfCommit'].filter(k => found.a[k] !== b[k]);
      const overPeak = c?.peakDep ? (found.a.depBal / c.peakDep - 1) * 100 : 0;
      return { ...p, feasible: true, a: found.a, k: found.k, changed,
        reason: `${p.bps} bps concession; smallest deposit balance that keeps RAROC ≥ ${target}% while lifting revenue is ${cr(found.a.depBal, 0)}${p.txn ? `, with transactions +${p.txn * 100}%` : ''}${p.tf ? ` and trade finance +${p.tf * 100}%` : ''}.`,
        caveat: overPeak > 10 ? `Deposit level is ${fmt(overPeak, 0)}% above the customer's historical peak.` : 'Within the customer\u2019s historical deposit range.' };
    });
  },
  explain(sim, sc) {
    const b = sim.baseline; const base = E.simulate(b, b, S.cfg).kpi; const k = E.simulate(sc.a, b, S.cfg).kpi;
    const comps = [
      ['lending NII (pricing & utilisation)', k.lendingNII - base.lendingNII], ['deposit funding value', k.depValue - base.depValue], ['transaction fees', k.txnFeeRev - base.txnFeeRev],
      ['trade finance commission', k.tfFee - base.tfFee], ['other income', k.otherInc - base.otherInc], ['operating cost', -(k.totalCost - base.totalCost)], ['expected loss', -(k.el - base.el)],
    ].filter(x => Math.abs(x[1]) > 0.005).sort((p, q) => Math.abs(q[1]) - Math.abs(p[1]));
    const d = k.pbt - base.pbt;
    let t = `${sc.name} ${d >= 0 ? 'adds' : 'removes'} ${cr(Math.abs(d))} of profit before tax versus baseline (${cr(base.pbt)} → ${cr(k.pbt)}). `;
    const pos = comps.filter(x => x[1] > 0), neg = comps.filter(x => x[1] < 0);
    if (pos.length) t += `Gains come from ${pos.map(x => `${x[0]} (+${cr(x[1])})`).join(', ')}. `;
    if (neg.length) t += `These are partly offset by ${neg.map(x => `${x[0]} (−${cr(Math.abs(x[1]))})`).join(', ')}. `;
    t += `RAROC moves from ${pct(base.raroc)} to ${pct(k.raroc)} because capital changes only ${cr(k.capital - base.capital)} while after-tax profit changes ${cr(k.pat - base.pat)}.`;
    if (k.commitCoverage < 75) t += ` Note: today the customer delivers only ${pct(k.commitCoverage, 0)} of the commitments this scenario relies on.`;
    return { text: t, comps };
  },
  strongest(sim) {
    const b = sim.baseline; const base = E.simulate(b, b, S.cfg).kpi;
    const rank = sim.scenarios.map(s => {
      const k = E.simulate(s.a, b, S.cfg).kpi; const k80 = E.simulate({ ...s.a, fulfilPct: 80 }, b, S.cfg).kpi;
      return { s, k, k80 };
    }).sort((p, q) => q.k.eva - p.k.eva);
    if (!rank.length) return { text: 'Add at least one scenario to compare.', rank };
    const top = rank[0]; const robust = rank.slice().sort((p, q) => q.k80.eva - p.k80.eva)[0];
    const lowestRate = rank.slice().sort((p, q) => p.s.a.wcRate - q.s.a.wcRate)[0];
    let t = `${top.s.name} provides the strongest overall relationship economics: profit ${cr(top.k.pbt)} (${top.k.pbt >= base.pbt ? '+' : ''}${cr(top.k.pbt - base.pbt)} vs baseline), RAROC ${pct(top.k.raroc)} and economic value added ${cr(top.k.eva)}. `;
    if (lowestRate.s.id === top.s.id && top.s.a.wcRate < b.wcRate) t += `It carries the lowest lending rate (${pct(top.s.a.wcRate, 2)}), showing that the deepest concession can still win when balances and cross-product commitments are secured. `;
    t += robust.s.id === top.s.id ? `The ranking holds if only 80% of committed uplifts are delivered (profit ${cr(top.k80.pbt)}).` : `If only 80% of committed uplifts are delivered, ${robust.s.name} becomes stronger (EVA ${cr(robust.k80.eva)} vs ${cr(top.k80.eva)}) — commitment delivery is the key risk.`;
    const breaches = rank.filter(x => x.k.raroc < S.cfg.targetRaroc).map(x => x.s.name);
    if (breaches.length) t += ` ${breaches.join(', ')} fall${breaches.length === 1 ? 's' : ''} below the ${S.cfg.targetRaroc}% RAROC target.`;
    return { text: t, rank, top };
  },
  suggest(sim) {
    const c = custById(sim.customerId); const b = sim.baseline;
    const g = c ? (c.trend[11].txn / c.trend[0].txn - 1) * 100 : 10; const util = b.wcBal / b.wcLimit * 100;
    const lo = Math.max(5, Math.round((g + 3) / 5) * 5), hi = lo + 10;
    return [
      { key: 'txnVol', text: `Based on ${fmt(g, 0)}% transaction growth over the last 12 months and ${fmt(util, 0)}% working-capital utilisation, consider modelling transaction volume growth between ${lo}% and ${hi}%.`, value: Math.round(b.txnVol * (1 + (lo + hi) / 200) / 100) * 100, label: `Transactions +${(lo + hi) / 2}%` },
      { key: 'depBal', text: `The customer's peak average deposit balance was ${cr(c?.peakDep || b.depBal, 0)}. A commitment above ${cr((c?.peakDep || b.depBal) * 1.25, 0)} has low historical support; ${cr(Math.round((c?.peakDep || b.depBal) * 1.2), 0)} is a stretch but defensible ask.`, value: Math.round((c?.peakDep || b.depBal) * 1.2), label: `Deposits ${cr(Math.round((c?.peakDep || b.depBal) * 1.2), 0)}` },
      { key: 'fulfilPct', text: 'Similar mid-corporate renewals delivered about 80% of committed uplift in the first year (outcome tracking). Model fulfilment at 80% to see a probability-weighted view.', value: 80, label: 'Fulfilment 80%' },
    ];
  },
  summary(sim) {
    const st = AI.strongest(sim); const c = custById(sim.customerId); const b = sim.baseline;
    if (!st.top) return st.text;
    const t = st.top; const bps = Math.round((b.wcRate - t.s.a.wcRate) * 100);
    return `${c?.name || 'The customer'} requested improved working-capital pricing. ${sim.scenarios.length} alternatives were simulated against a baseline profit of ${cr(E.simulate(b, b, S.cfg).kpi.pbt)} and RAROC of ${pct(E.simulate(b, b, S.cfg).kpi.raroc)}. ${t.s.name} is recommended: a ${bps} bps concession exchanged for ${cr(t.s.a.depBal, 0)} deposits and ${int(t.s.a.txnVol)} transactions a month, producing ${cr(t.k.pbt)} profit and ${pct(t.k.raroc)} RAROC. Key risk: delivery of commitments (today ${pct(t.k.commitCoverage, 0)} covered). Approval needed from ${E.requiredApprovals(t.s.a, b, { kpi: t.k }, E.simulate(b, b, S.cfg), S.cfg).map(a => Seed.ROLES[a.role]).join(', ')}.`;
  },
  parse(text) {
    const VARS = [
      { re: /(term[- ]loan)/, key: 'tlRate', label: 'Term loan rate', kind: 'rate' },
      { re: /(lending|loan|working[- ]capital|\bwc\b|pricing|interest rate|\brate\b|price)/, key: 'wcRate', label: 'Working capital rate', kind: 'rate' },
      { re: /(deposit|casa|balances?)/, key: 'depBal', label: 'Deposit balance', kind: 'amount' },
      { re: /(transaction|txn|payments?)/, key: 'txnVol', label: 'Transaction volume', kind: 'count' },
      { re: /(trade finance|\btf\b|trade)/, key: 'tfVol', label: 'Trade finance volume', kind: 'amount' },
      { re: /(cost of funds|\bcof\b|funding)/, key: 'cofBps', label: 'Cost of funds shift', kind: 'bps' },
      { re: /(risk cost|expected loss|credit cost)/, key: 'riskMult', label: 'Risk cost', kind: 'mult' },
      { re: /(fee|tariff|charge)/, key: 'txnFee', label: 'Cash management fee', kind: 'price' },
    ];
    const out = []; let verbSign = 1;
    const clauses = text.toLowerCase().replace(/basis points?/g, 'bps').split(/,|;|\band\b|\bthen\b/);
    clauses.forEach(cl => {
      if (/(reduce|cut|lower|decrease|drop|fall|less|minus|down)/.test(cl)) verbSign = -1;
      else if (/(increase|raise|add|grow|higher|more|plus|up|boost)/.test(cl)) verbSign = 1;
      const v = VARS.find(x => x.re.test(cl)); if (!v) return;
      const m = cl.match(/([+-]?\d+(?:\.\d+)?)\s*(bps|bp|%|cr|crore|k|txns?)?/); if (!m) return;
      let num = parseFloat(m[1]); const unit = (m[2] || '').replace('crore', 'cr');
      const sign = /^[+-]/.test(m[1]) ? 1 : verbSign; num *= sign;
      if (out.some(o => o.key === v.key)) return;
      out.push({ key: v.key, label: v.label, kind: v.kind, num, unit });
    });
    return out.map(o => {
      if (o.kind === 'rate') { const bps = o.unit === '%' ? o.num * 100 : o.num; return { ...o, op: 'add', value: bps / 100, display: `${bps > 0 ? '+' : ''}${fmt(bps, 0)} bps` }; }
      if (o.kind === 'bps') return { ...o, op: 'add', value: o.num, display: `${o.num > 0 ? '+' : ''}${fmt(o.num, 0)} bps` };
      if (o.kind === 'price') return { ...o, op: o.unit === '%' ? 'pct' : 'add', value: o.num, display: o.unit === '%' ? `${o.num > 0 ? '+' : ''}${o.num}%` : `${o.num > 0 ? '+' : '−'}₹${Math.abs(o.num)} per txn` };
      if (o.kind === 'mult') return { ...o, op: 'pct', value: o.num, display: `${o.num > 0 ? '+' : ''}${o.num}%` };
      if (o.unit === '%') return { ...o, op: 'pct', value: o.num, display: `${o.num > 0 ? '+' : ''}${o.num}%` };
      if (o.kind === 'count') return { ...o, op: 'add', value: o.unit === 'k' ? o.num * 1000 : o.num, display: `${o.num > 0 ? '+' : ''}${int(o.unit === 'k' ? o.num * 1000 : o.num)} / month` };
      return { ...o, op: 'add', value: o.num, display: `${o.num > 0 ? '+' : '−'}₹${fmt(Math.abs(o.num), 0)} Cr` };
    });
  },
  applyParsed(a, parsed) {
    const n = { ...a };
    parsed.forEach(p => {
      if (p.key === 'riskMult') n.riskMult = a.riskMult * (1 + p.value / 100);
      else if (p.op === 'pct') n[p.key] = a[p.key] * (1 + p.value / 100);
      else n[p.key] = a[p.key] + p.value;
      if (p.key === 'txnVol') n.txnVol = Math.round(n.txnVol);
      if (p.key === 'depBal' && n.depBal > a.depCommit) n.depCommit = n.depBal;
      if (p.key === 'txnVol' && n.txnVol > a.txnCommit) n.txnCommit = n.txnVol;
      if (p.key === 'tfVol' && n.tfVol > a.tfCommit) n.tfCommit = n.tfVol;
    });
    return n;
  },
};

/* ---------------- chart helpers (inline SVG, theme-aware) ---------------- */
const Chart = {
  line({ series, w = 640, h = 240, xFmt = v => v, yFmt = v => fmt(v, 1), target, xLabel = '', marker }) {
    const pad = { l: 58, r: 16, t: 14, b: 34 };
    const xs = series.flatMap(s => s.points.map(p => p.x)), ys = series.flatMap(s => s.points.map(p => p.y)).concat(target != null ? [target] : []);
    if (!xs.length) return '<div class="empty">No data</div>';
    let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    if (x0 === x1) x1 = x0 + 1; const yp = (y1 - y0) * 0.12 || Math.abs(y1) * 0.1 || 1; y0 -= yp; y1 += yp;
    const X = v => pad.l + (v - x0) / (x1 - x0) * (w - pad.l - pad.r), Y = v => h - pad.b - (v - y0) / (y1 - y0) * (h - pad.t - pad.b);
    const ticks = 5; let g = '';
    for (let i = 0; i <= ticks; i++) { const v = y0 + (y1 - y0) * i / ticks; g += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${pad.l - 8}" y="${Y(v) + 4}" class="ax" text-anchor="end">${esc(yFmt(v))}</text>`; }
    const uniqX = [...new Set(xs)].sort((a, b) => a - b); const every = Math.ceil(uniqX.length / 8);
    uniqX.forEach((v, i) => { if (i % every === 0 || i === uniqX.length - 1) g += `<text x="${X(v)}" y="${h - pad.b + 18}" class="ax" text-anchor="middle">${esc(xFmt(v))}</text>`; });
    if (target != null) g += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${Y(target)}" y2="${Y(target)}" class="target"/><text x="${w - pad.r}" y="${Y(target) - 5}" class="ax tgt" text-anchor="end">Target ${esc(yFmt(target))}</text>`;
    if (marker != null) g += `<line x1="${X(marker)}" x2="${X(marker)}" y1="${pad.t}" y2="${h - pad.b}" class="marker"/><text x="${X(marker) + 4}" y="${pad.t + 10}" class="ax">Current</text>`;
    series.forEach(s => {
      const d = s.points.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
      g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" ${s.dash ? 'stroke-dasharray="4 4"' : ''}/>`;
      if (s.dots !== false) s.points.forEach(p => g += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" fill="${s.color}"><title>${esc(s.name)}: ${esc(xFmt(p.x))} → ${esc(yFmt(p.y))}</title></circle>`);
    });
    if (xLabel) g += `<text x="${(w + pad.l) / 2}" y="${h - 2}" class="ax" text-anchor="middle">${esc(xLabel)}</text>`;
    return `<svg viewBox="0 0 ${w} ${h}" class="chart" role="img" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
  },
  tornado(rows, { w = 640, padL = 220, fmtV = v => cr(v) } = {}) {
    const rowH = 30, pad = { l: padL, r: 70, t: 22 }; const h = pad.t + rows.length * rowH + 10;
    const m = Math.max(...rows.map(r => Math.max(Math.abs(r.lo), Math.abs(r.hi))), 0.0001);
    const cx = pad.l + (w - pad.l - pad.r) / 2, half = (w - pad.l - pad.r) / 2; let g = `<line x1="${cx}" x2="${cx}" y1="${pad.t - 8}" y2="${h - 6}" class="axis"/>`;
    g += `<text x="${cx - 6}" y="12" class="ax" text-anchor="end">Downside</text><text x="${cx + 6}" y="12" class="ax">Upside</text>`;
    rows.forEach((r, i) => {
      const y = pad.t + i * rowH; const lo = Math.min(r.lo, r.hi), hi = Math.max(r.lo, r.hi);
      g += `<text x="${pad.l - 10}" y="${y + 18}" class="lbl" text-anchor="end">${esc(r.label)}</text>`;
      g += `<rect x="${cx + lo / m * half}" y="${y + 6}" width="${Math.max(1, -lo / m * half)}" height="18" class="bar-neg"><title>${esc(fmtV(lo))}</title></rect>`;
      g += `<rect x="${cx}" y="${y + 6}" width="${Math.max(1, hi / m * half)}" height="18" class="bar-pos"><title>${esc(fmtV(hi))}</title></rect>`;
      g += `<text x="${w - 4}" y="${y + 19}" class="ax" text-anchor="end">±${esc(fmtV(Math.abs(hi - lo) / 2))}</text>`;
    });
    return `<svg viewBox="0 0 ${w} ${h}" class="chart" role="img">${g}</svg>`;
  },
  waterfall(steps, { w = 640, h = 230 } = {}) {
    const pad = { l: 12, r: 12, t: 22, b: 46 }; let run = 0; const bars = [];
    steps.forEach(s => { if (s.total) { bars.push({ ...s, from: 0, to: s.value }); run = s.value; } else { bars.push({ ...s, from: run, to: run + s.value }); run += s.value; } });
    const all = bars.flatMap(b => [b.from, b.to]); const y0 = Math.min(0, ...all), y1 = Math.max(...all) * 1.08;
    const bw = (w - pad.l - pad.r) / bars.length; const Y = v => h - pad.b - (v - y0) / (y1 - y0) * (h - pad.t - pad.b);
    let g = `<line x1="${pad.l}" x2="${w - pad.r}" y1="${Y(0)}" y2="${Y(0)}" class="axis"/>`;
    bars.forEach((b, i) => {
      const x = pad.l + i * bw + bw * 0.16, top = Math.min(Y(b.from), Y(b.to)), hh = Math.max(1.5, Math.abs(Y(b.from) - Y(b.to)));
      const cls = b.total ? 'bar-total' : b.value >= 0 ? 'bar-pos' : 'bar-neg';
      g += `<rect x="${x}" y="${top}" width="${bw * 0.68}" height="${hh}" class="${cls}"><title>${esc(b.label)}: ${esc(cr(b.value))}</title></rect>`;
      g += `<text x="${x + bw * 0.34}" y="${top - 5}" class="ax" text-anchor="middle">${b.value < 0 ? '−' : ''}${fmt(Math.abs(b.value), 2)}</text>`;
      const words = b.label.split(' '); const l1 = words.slice(0, 2).join(' '), l2 = words.slice(2).join(' ');
      g += `<text x="${x + bw * 0.34}" y="${h - pad.b + 16}" class="ax" text-anchor="middle">${esc(l1)}</text>`;
      if (l2) g += `<text x="${x + bw * 0.34}" y="${h - pad.b + 29}" class="ax" text-anchor="middle">${esc(l2)}</text>`;
    });
    return `<svg viewBox="0 0 ${w} ${h}" class="chart" role="img">${g}</svg>`;
  },
  bars(groups, { w = 640, h = 220, yFmt = v => fmt(v, 1), target } = {}) {
    // groups: [{label, values:[{name,color,v}]}]
    const pad = { l: 52, r: 10, t: 16, b: 34 }; const vals = groups.flatMap(g => g.values.map(v => v.v)).concat(target != null ? [target] : []);
    const y0 = Math.min(0, ...vals), y1 = Math.max(...vals) * 1.12 || 1; const Y = v => h - pad.b - (v - y0) / (y1 - y0) * (h - pad.t - pad.b);
    const gw = (w - pad.l - pad.r) / groups.length; let g = '';
    for (let i = 0; i <= 4; i++) { const v = y0 + (y1 - y0) * i / 4; g += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${pad.l - 6}" y="${Y(v) + 4}" class="ax" text-anchor="end">${esc(yFmt(v))}</text>`; }
    groups.forEach((gr, i) => {
      const n = gr.values.length; const bw = gw * 0.72 / n;
      gr.values.forEach((v, j) => { const x = pad.l + i * gw + gw * 0.14 + j * bw; const top = Math.min(Y(0), Y(v.v)); g += `<rect x="${x}" y="${top}" width="${bw - 2}" height="${Math.max(1, Math.abs(Y(v.v) - Y(0)))}" fill="${v.color}"><title>${esc(v.name)}: ${esc(yFmt(v.v))}</title></rect>`; });
      g += `<text x="${pad.l + i * gw + gw / 2}" y="${h - pad.b + 18}" class="ax" text-anchor="middle">${esc(gr.label)}</text>`;
    });
    if (target != null) g += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${Y(target)}" y2="${Y(target)}" class="target"/><text x="${w - pad.r}" y="${Y(target) - 4}" class="ax tgt" text-anchor="end">Target ${esc(yFmt(target))}</text>`;
    return `<svg viewBox="0 0 ${w} ${h}" class="chart" role="img">${g}</svg>`;
  },
  spark(vals, { w = 120, h = 32, color = 'var(--brand)' } = {}) {
    const a = Math.min(...vals), b = Math.max(...vals) || 1; const X = i => i / (vals.length - 1) * (w - 4) + 2, Y = v => h - 3 - (v - a) / ((b - a) || 1) * (h - 6);
    return `<svg viewBox="0 0 ${w} ${h}" class="spark"><path d="${vals.map((v, i) => `${i ? 'L' : 'M'}${X(i)},${Y(v)}`).join('')}" fill="none" stroke="${color}" stroke-width="1.6"/></svg>`;
  },
  stack(parts) {
    const t = parts.reduce((s, p) => s + Math.max(0, p.v), 0) || 1;
    return `<div class="stackbar">${parts.map(p => `<span style="flex:${Math.max(0, p.v) / t};background:${p.color}" title="${esc(p.name)}: ${esc(cr(p.v))} (${fmt(p.v / t * 100, 0)}%)"></span>`).join('')}</div><div class="legend">${parts.map(p => `<span><i style="background:${p.color}"></i>${esc(p.name)} ${fmt(p.v / t * 100, 0)}%</span>`).join('')}</div>`;
  },
};

function openModal({ title, body, confirm = 'Confirm', cancel = 'Cancel', onConfirm, danger }) {

  $('#modal').innerHTML = `<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">${esc(title)}</h3><div class="modal-body">${body}</div><div class="modal-err" id="modal-err"></div><div class="modal-actions"><button class="btn ghost" data-act="modal-close">${esc(cancel)}</button>${onConfirm ? `<button class="btn ${danger ? 'danger' : 'primary'}" data-act="modal-ok">${esc(confirm)}</button>` : ''}</div></div>`;
  $('#modal').classList.add('open'); setTimeout(() => ($('#modal input, #modal textarea, #modal select') || $('#modal .btn.primary'))?.focus(), 30);
}
function closeModal() { $('#modal').classList.remove('open'); $('#modal').innerHTML = ''; modalHandler = null; }
function modalValues() { const o = {}; document.querySelectorAll('#modal [name]').forEach(el => o[el.name] = el.type === 'checkbox' ? el.checked : el.value); return o; }
function notify(msg, kind = 'ok') { const t = document.createElement('div'); t.className = `toast ${kind}`; t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.classList.add('out'), 3600); setTimeout(() => t.remove(), 4100); }

function render() {
  const root = $('#app');
  try {
    if (!S.userId) { root.className = 'login-mode'; root.innerHTML = loginView(); return; }
    root.className = '';
    const h = location.hash || '#/home';
    const r = ROUTES.find(x => x.re.test(h)) || ROUTES[0];
    const m = h.match(r.re) || [];
    const out = r.fn(...m.slice(1));
    root.innerHTML = shell(out.html, out.title, out.crumbs || '');
    out.after && out.after();
    const routeKey = h.split('/').slice(0, 3).join('/'); if (routeKey !== render.last) { window.scrollTo(0, 0); render.last = routeKey; }
  } catch (err) {
    console.error(err);
    root.innerHTML = shell(`<div class="panel error-state"><h2>This screen could not be displayed</h2><p>Something in the demo state is inconsistent. Reset the demo data from Administration, or go back to the Decision centre.</p><div class="row"><a class="btn primary" href="#/home">Go to Decision centre</a><button class="btn ghost" data-act="reset-demo">Reset demo data</button></div><details><summary>Technical detail</summary><pre>${esc(err.message)}</pre></details></div>`, 'Something went wrong');
  }
}

      <div><dt>Economic capital</dt><dd>${cr(k.capital)} ${tag('CALC')}</dd></div><div><dt>WC utilisation</dt><dd>${fmt(a.wcBal / a.wcLimit * 100, 0)}% ${tag('OBS')}</dd></div></dl></section>
    <section class="panel"><div class="panel-h"><h2>Relationship trend</h2><small class="muted">Revenue, last 12 months</small></div>${Chart.line({ series: [{ name: 'Revenue (annualised)', color: 'var(--brand)', points: trendRev }], w: 400, h: 220, xFmt: i => Seed.MONTHS[i]?.split(' ')[0] || '', yFmt: v => fmt(v, 2) })}
      <p class="muted sm">Transactions grew ${fmt((c.trend[11].txn / c.trend[0].txn - 1) * 100, 0)}% over the year.</p></section>
  </div>

/* ---------------- Workspace ---------------- */
const STAGES = ['Baseline', 'Assumptions', 'Simulation', 'Comparison', 'Decision', 'Approval', 'Outcome'];
function stageOf(sim) { return { Draft: 1, Simulated: 3, 'Under Review': 5, 'Awaiting Approval': 5, Rejected: 4, Approved: 5, Executed: 6, Monitoring: 6 }[sim.status] ?? 2; }
function ribbon(sim) {

}

route(/^#\/sim\/([\w-]+)(?:\/(\w+))?$/, (id, tab) => {

  <section class="ws-head"><div><div class="row gap"><h2>${esc(sim.name)}</h2>${statusPill(sim.status)}<span class="chip ghost">${TYPE_LABEL[sim.type]}</span></div>
  <p class="q">“${esc(sim.question)}”</p>
  <small class="muted">${sim.code} · owner ${esc(userById(sim.owner).name)} · baseline ${sim.baselineMeta.id} as of ${sim.baselineMeta.asOf} · snapshot ${sim.baselineMeta.snapshot} · ${esc(sim.baselineMeta.model)}</small></div>
  <div class="ws-head-r">${sim.customerId ? `<a class="btn ghost" href="#/customer/${sim.customerId}">Customer 360</a>` : ''}${['Approved', 'Executed', 'Monitoring'].includes(sim.status) ? `<a class="btn primary" href="#/package/${sim.id}">Decision package</a>` : `<a class="btn ghost" href="#/package/${sim.id}">Preview decision package</a>`}</div></section>

function scenarioBar(sim, editable) {

function wsBuild(sim) {
  const editable = Auth.can('scenario.edit', { sim }); const cur = sim.scenarios.find(s => s.id === UI.scen);

  const row = f => {
    const v = a[f.k], bv = b[f.k]; const cls = cur ? (cur.cls[f.k] || (v !== bv ? 'USER' : (f.cls || 'OBS'))) : (f.cls || 'OBS');
    const missing = c?.missing?.includes(f.k);

      <div class="fb" id="fb-${f.k}">${cur ? (d ? `<small>was ${fieldFmt(f, bv)}</small>` : '<small class="muted">= baseline</small>') : ''}</div></div>`;

      ${cur && editable ? `<div class="nl"><label for="nl">Describe a change in plain language</label><div class="row"><input id="nl" placeholder="Reduce lending rate by 30 basis points, increase deposits by INR 15 Cr and transactions by 20%"><button class="btn" data-act="nl-parse">Parse</button></div></div>` : ''}
      ${groups.map(g => { const fs = Seed.FIELDS.filter(f => f.g === g); const nChg = cur ? fs.filter(f => a[f.k] !== b[f.k]).length : 0; return `<details class="fgroup" ${UI.open[g] ? 'open' : ''} data-group="${g}"><summary>${g}${nChg ? ` <span class="nchg">${nChg} changed</span>` : ''}</summary>${fs.map(row).join('')}</details>`; }).join('')}
    </section>
    <section class="impact" id="impact">${impactPanel(sim)}</section>

  return { html };
}

function impactPanel(sim) {
  const cur = sim.scenarios.find(s => s.id === UI.scen); const b = sim.baseline;
  const base = E.simulate(b, b, S.cfg); const r = cur ? E.simulate(cur.a, b, S.cfg) : base; const k = r.kpi, bk = base.kpi;

    ['pbt', 'Profit before tax', cr(k.pbt), dlt(k.pbt, bk.pbt, { unit: 'Cr' }), 'profit'], ['raroc', 'RAROC', pct(k.raroc), dlt(k.raroc, bk.raroc, { pp: true }), 'raroc'], ['rwa', 'RWA', cr(k.rwa, 1), dlt(k.rwa, bk.rwa, { unit: 'Cr', inverse: true }), 'rwa'], ['eva', 'Relationship value (EVA)', cr(k.eva), dlt(k.eva, bk.eva, { unit: 'Cr' }), 'raroc']];

  const bridge = [{ label: 'Baseline profit', value: bk.pbt, total: true }, { label: 'Lending NII', value: k.lendingNII - bk.lendingNII }, { label: 'Deposit value', value: k.depValue - bk.depValue }, { label: 'Fees & comm.', value: k.feeIncome - bk.feeIncome }, { label: 'Cost', value: -(k.totalCost - bk.totalCost) }, { label: 'Expected loss', value: -(k.el - bk.el) }, { label: cur ? 'Scenario profit' : 'Profit', value: k.pbt, total: true }];

    <div class="cov"><span>Commitment coverage today</span><div class="prog"><i style="width:${k.commitCoverage}%" class="${k.commitCoverage < 70 ? 'lo' : k.commitCoverage < 90 ? 'mid' : ''}"></i></div><b>${pct(k.commitCoverage, 0)}</b></div>

    <h3 class="sub">Business warnings</h3>${w.length ? `<ul class="warns">${w.map(x => `<li class="w-${x.level}"><b>${x.type}</b>${esc(x.text)}</li>`).join('')}</ul>` : '<p class="muted sm">No warnings for this scenario.</p>'}</div>`;
}

function compareTable(sim, { selectable = false } = {}) {

function wsCompare(sim) {

  return { html: `<section class="panel"><div class="panel-h"><h2>Scenario comparison</h2><small class="muted">Absolute and percentage variance against baseline</small></div>${compareTable(sim, { selectable: true })}</section>

}

/* ---------------- Sensitivity ---------------- */
function wsSens(sim) {
  const list = sim.scenarios; if (!list.length) return { html: '<div class="panel empty">Add a scenario first.</div>' };
  const def = list.find(s => s.id === sim.selectedId) || list[list.length - 1];
  UI.sens = UI.sens && UI.sens.simId === sim.id ? UI.sens : { simId: sim.id, scen: def.id, kpi: 'pbt', v: 'depBal', from: 20, to: 60, step: 5, ran: true };
  const P = UI.sens; const sc = list.find(s => s.id === P.scen) || def;
  const VAR_DEF = { wcRate: [8.5, 9.5, 0.05], depBal: [20, 60, 5], txnVol: [15000, 35000, 2500], cofBps: [-100, 100, 25], riskMult: [50, 200, 25], tfVol: [80, 200, 20], fulfilPct: [40, 100, 10] };
  const pts = E.sensitivity(sc.a, sim.baseline, S.cfg, P.v, +P.from, +P.to, +P.step, P.kpi);
  const ptsB = E.sensitivity(sim.baseline, sim.baseline, S.cfg, P.v, +P.from, +P.to, +P.step, P.kpi);
  const V = E.SENS_VARS[P.v]; const isPct = P.kpi === 'raroc'; const yF = v => isPct ? fmt(v, 1) + '%' : fmt(v, 2);
  const xF = v => V.unit === 'txns' ? (v / 1000).toFixed(1) + 'k' : fmt(v, V.dec);
  // breakeven vs target / baseline
  const baseK = E.simulate(sim.baseline, sim.baseline, S.cfg).kpi;
  const cross = (() => { const tgt = P.kpi === 'raroc' ? S.cfg.targetRaroc : baseK[P.kpi]; for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i]; if ((a.y - tgt) * (b.y - tgt) <= 0 && a.y !== b.y) return { x: a.x + (tgt - a.y) / (b.y - a.y) * (b.x - a.x), tgt }; } return null; })();
  const html = `<section class="panel"><div class="panel-h"><h2>Sensitivity analysis</h2><small class="muted">Repeated deterministic runs of the simulation engine</small></div>
  <div class="filters"><label>Scenario<select data-sens="scen">${list.map(s => `<option value="${s.id}" ${s.id === sc.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>
  <label>Target KPI<select data-sens="kpi">${Object.entries(E.KPIS).map(([k, l]) => `<option value="${k}" ${k === P.kpi ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
  <label>Variable<select data-sens="v" data-defs='${JSON.stringify(VAR_DEF)}'>${Object.entries(E.SENS_VARS).map(([k, x]) => `<option value="${k}" ${k === P.v ? 'selected' : ''}>${x.label}</option>`).join('')}</select></label>
  <label>From<input type="number" data-sens="from" value="${P.from}" step="any"></label><label>To<input type="number" data-sens="to" value="${P.to}" step="any"></label><label>Step<input type="number" data-sens="step" value="${P.step}" step="any"></label>
  <label class="btn-l"><button class="btn primary" data-act="sens-run">Run sensitivity</button></label><label class="btn-l"><button class="btn ghost" data-act="sens-save">Save to decision package</button></label></div>
  <div class="grid-2-1"><div>${Chart.line({ series: [{ name: esc(sc.name), color: Scen.color(sim, sc), points: pts }, { name: 'Baseline', color: 'var(--base-c)', points: ptsB, dash: true, dots: false }], h: 280, xFmt: xF, yFmt: yF, xLabel: `${V.label} (${V.unit})`, target: P.kpi === 'raroc' ? S.cfg.targetRaroc : null, marker: sc.a[P.v] >= +P.from && sc.a[P.v] <= +P.to ? sc.a[P.v] : null })}
  <p class="insight">${cross ? `${E.KPIS[P.kpi]} for ${esc(sc.name)} crosses ${P.kpi === 'raroc' ? `the ${S.cfg.targetRaroc}% target` : `the baseline value (${yF(cross.tgt)})`} at ${V.label.toLowerCase()} ≈ <b>${xF(cross.x)} ${V.unit}</b>.` : `${E.KPIS[P.kpi]} stays ${pts[0] && pts[0].y > (P.kpi === 'raroc' ? S.cfg.targetRaroc : baseK[P.kpi]) ? 'above' : 'below'} ${P.kpi === 'raroc' ? 'target' : 'baseline'} across the whole range.`} Dashed line: baseline structure with the same variable flexed.</p></div>
  <div class="tbl-wrap tall"><table class="tbl"><thead><tr><th>${esc(V.label)}</th><th class="r">${E.KPIS[P.kpi]}</th><th class="r">vs baseline</th></tr></thead><tbody>${pts.map(p => `<tr><td>${xF(p.x)} ${V.unit}</td><td class="r">${yF(p.y)}</td><td class="r">${isPct ? dlt(p.y, baseK.raroc, { pp: true }) : dlt(p.y, baseK[P.kpi], { unit: 'Cr', showPct: false })}</td></tr>`).join('')}</tbody></table></div></div></section>
  ${(sim.sensRuns || []).length ? `<section class="panel"><div class="panel-h"><h2>Saved sensitivity runs</h2></div><table class="tbl"><thead><tr><th>Run</th><th>Scenario</th><th>KPI</th><th>Variable & range</th><th>Saved</th></tr></thead><tbody>${sim.sensRuns.map(r => `<tr><td>${r.id}</td><td>${esc(r.scen)}</td><td>${E.KPIS[r.kpi]}</td><td>${esc(r.label)}</td><td>${fmtDT(r.at)}</td></tr>`).join('')}</tbody></table></section>` : ''}`;
  return { html };
}

/* ---------------- Drivers ---------------- */
function wsDrivers(sim) {
  const list = sim.scenarios; if (!list.length) return { html: '<div class="panel empty">Add a scenario first.</div>' };
  const sc = list.find(s => s.id === (UI.drvScen || sim.selectedId)) || list[list.length - 1];
  const kpi = UI.drvKpi || 'pbt';
  const rows = E.drivers(sc.a, sim.baseline, S.cfg, kpi);
  const fmtV = kpi === 'raroc' ? v => `${fmt(v, 2)} pp` : v => cr(v);

/* ---------------- Stress ---------------- */
function wsStress(sim) {

  const T = E.STRESS_TEMPLATES;
  const cell = (a, sh, key) => { const r = E.stressOne(a, S.cfg, sh); return { v: r.stressed[key], d: r.stressed[key] - r.base[key], raroc: r.stressed.raroc }; };
  const key = UI.stressKpi || 'pbt';
  return { html: `<section class="panel"><div class="panel-h"><h2>Stress each alternative</h2><small class="muted">Reusable stress templates applied to every scenario</small></div>
  <div class="filters"><label>Show<select data-stress="kpi"><option value="pbt" ${key === 'pbt' ? 'selected' : ''}>Profit before tax</option><option value="raroc" ${key === 'raroc' ? 'selected' : ''}>RAROC</option><option value="nii" ${key === 'nii' ? 'selected' : ''}>NII</option></select></label></div>
  <div class="tbl-wrap"><table class="tbl cmp"><thead><tr><th>Stress template</th>${cols.map(c => `<th><span class="swatch" style="background:${c.color}"></span>${esc(c.name)}</th>`).join('')}</tr></thead><tbody>
  <tr class="keyrow"><th>Unstressed</th>${cols.map(c => { const k = E.simulate(c.a, null, S.cfg).kpi; return `<td>${key === 'raroc' ? pct(k.raroc) : cr(k[key])}</td>`; }).join('')}</tr>
  ${T.map(t => `<tr><th>${esc(t.name)}</th>${cols.map(c => { const x = cell(c.a, t.shocks, key); return `<td>${key === 'raroc' ? pct(x.v) : cr(x.v)}<br><span class="delta ${x.d < 0 ? 'neg' : 'pos'}">${key === 'raroc' ? `${x.d > 0 ? '+' : ''}${fmt(x.d, 1)} pp` : `${x.d > 0 ? '+' : '−'}₹${fmt(Math.abs(x.d), 2)} Cr`}</span>${x.raroc < S.cfg.targetRaroc ? ' <span class="flag" title="RAROC below target">below target</span>' : ''}</td>`; }).join('')}</tr>`).join('')}
  </tbody></table></div>
  <p class="insight">Relationship structures with more deposits are more exposed to rate cuts (deposit funding value reprices fully) but more resilient to funding shocks. Pass-through assumptions are documented under Administration.</p></section>` };
}

function routeFreeText(q) {
  const t = q.toLowerCase();
  if (/(create|generate|build).*(option|scenario|alternative)/.test(t)) return 'gen';
  if (/(strongest|best|which scenario|recommend)/.test(t)) return 'best';
  if (/(why|explain)/.test(t)) return 'explain';
  if (/(suggest|assumption|range)/.test(t)) return 'suggest';
  if (/(summary|summar|executive)/.test(t)) return 'summary';
  return 'nl';
}

function approvalTimeline(sim) {
  const ev = [{ t: 'Created', by: userById(sim.owner).name, at: sim.createdAt, st: 'done' }];

  (sim.approvals || []).forEach(a => ev.push({ t: a.label, by: a.by || Seed.ROLES[a.role], at: a.at, st: a.status === 'Pending' ? 'pending' : a.status === 'Rejected' ? 'rej' : 'done', c: a.comment, reason: a.reason, status: a.status }));
  if (['Executed', 'Monitoring'].includes(sim.status)) ev.push({ t: 'Executed', by: userById(sim.owner).name, at: sim.executedAt, st: 'done' });
  if (sim.status === 'Monitoring') ev.push({ t: 'Outcome monitoring', by: 'Prism', st: 'done' });

function ruleSentence(r) {
  const unit = r.appliedTo === 'value' ? '% of value' : ' per transaction';
  const cond = r.conditions?.items?.length ? `IF ${r.conditions.items.map(c => `${E.METRIC_LABEL[c.metric].toLowerCase()} ${c.cmp} ${int(c.value)}`).join(` ${r.conditions.op} `)} THEN ` : '';
  let body = '';
  if (r.type === 'fixed') body = `charge ${r.appliedTo === 'value' ? `${r.rate}%` : `₹${r.rate}`}${unit} on ${r.appliedTo}`;
  if (r.type === 'percent') body = `charge ${r.pct}% of each transaction's value${r.min !== '' && r.min != null ? `, minimum ₹${int(r.min)}` : ''}${r.max !== '' && r.max != null ? `, maximum ₹${int(r.max)}` : ''}`;
  if (r.type === 'slab') body = `find the tier based on ${E.METRIC_LABEL[r.basedOn].toLowerCase()} and apply that tier's rate to the whole ${r.appliedTo}: ${r.tiers.map(t => `${t.from}–${t.to ?? '∞'} → ${r.appliedTo === 'value' ? t.rate + '%' : '₹' + t.rate}`).join('; ')}`;
  if (r.type === 'progressive') body = `charge each band of ${r.appliedTo} at its own rate: ${r.tiers.map(t => `${t.from}–${t.to ?? '∞'} → ${r.appliedTo === 'value' ? t.rate + '%' : '₹' + t.rate}`).join('; ')}`;
  return cond + body + (cond ? ` ELSE ₹${r.elseRate ?? 0} per transaction` : '');
}
